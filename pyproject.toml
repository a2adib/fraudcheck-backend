[project]
name = "fraudcheck-backend"
version = "0.1.0"
description = "Multi-tenant COD risk assessment service for Bangladeshi e-commerce merchants"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=4.0.2",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "bcrypt==5.0.0",
    "cryptography>=46.0.0",
    "fastapi>=0.136.0",
    "greenlet>=3.4.0",
    "gunicorn>=25.3.0",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.0",
    "pydantic[email]>=2.13.3",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "redis>=6.4.0",
    "sqlmodel>=0.0.38",
    "sse-starlette>=3.0.2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.45.0",
]

[project.optional-dependencies]
# FR-17. The API starts and every non-ML requirement passes without these installed;
# CI proves it by running the main suite with the extra absent.
ml = [
    "joblib>=1.5.0",
    "pandas>=2.3.0",
    "scikit-learn>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "faker>=40.21.0",
    "mypy>=1.18.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.11",
]
test = [
    "pytest>=8.4",
    "pytest-asyncio>=0.26",
    "pytest-cov>=6.1",
    "pytest-dotenv>=0.5",
    "pytest-xdist>=3.8.0",
    "respx>=0.22.0",
    "time-machine>=2.19",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env_files = [".env.test"]

[tool.coverage.run]
source = ["src"]
omit = ["src/templates/*"]

[tool.coverage.report]
show_missing = true
# NFR-3 wants 80% overall and 100% on scoring / behavior / decision / breaker / lock.
# Enforced from M4: src/checks/scoring.py, src/logistics/breaker.py and
# src/logistics/token_manager.py are each at 100% today; the rest of the tree carries
# the 80% floor. Raise the floor as behavior/ and orders/ land, never lower it.
fail_under = 80

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["A002", "COM812", "CPY001", "D100", "D101", "D102", "D103", "D104", "D106", "D203", "D212", "D400", "D415", "DTZ005", "E501", "EM101", "FIX002", "G004", "PLC0415", "PLR0913", "PLW0108", "TD002", "TD003", "TRY003", "UP042", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["ANN001", "ANN201", "INP001"]
"scripts/**" = ["ANN001", "ANN202", "ANN401", "F401", "PLR2004", "S311", "T201", "S608"]
"tests/**" = ["ANN001", "ANN201", "ANN202", "ANN401", "ARG001", "ARG002", "PLR2004", "S101", "S105", "S106"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/", "^tests/", "^scripts/"]

[[tool.mypy.overrides]]
module = ["passlib.*", "sse_starlette.*"]
ignore_missing_imports = true
