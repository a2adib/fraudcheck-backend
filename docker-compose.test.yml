name: fraudcheck-test

services:
  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fraudcheck_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis_test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

  test_runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    env_file: .env.test
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres_test:5432/fraudcheck_test
      REDIS_HOST: redis_test
      REDIS_PORT: "6379"
    depends_on:
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_healthy
